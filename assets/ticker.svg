<g class="r"><text x="20" y="70" font-family="'Cambria Math', 'STIX Two Math', Cambria, Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#C9D1DB" xml:space="preserve"><tspan>σ²</tspan><tspan dy="4.8" font-size="10.2">t</tspan><tspan dy="-4.8"> = ω + α·ε²</tspan><tspan dy="4.8" font-size="10.2">t−1</tspan><tspan dy="-4.8"> + β·σ²</tspan><tspan dy="4.8" font-size="10.2">t−1</tspan><tspan dy="-4.8"> </tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>p(attack | x) = σ(w</tspan><tspan dy="-6.3" font-size="10.2">T</tspan><tspan dy="6.3"> x + b)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>f(x) = φ</tspan><tspan dy="4.8" font-size="10.2">0</tspan><tspan dy="-4.8"> + Σ</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> φ</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8">(x)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>r</tspan><tspan dy="4.8" font-size="10.2">t</tspan><tspan dy="-4.8"> = ln(P</tspan><tspan dy="4.8" font-size="10.2">t</tspan><tspan dy="-4.8"> / P</tspan><tspan dy="4.8" font-size="10.2">t−1</tspan><tspan dy="-4.8">)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>h</tspan><tspan dy="-6.3" font-size="10.2">(l)</tspan><tspan dy="6.3"> = ReLU(W</tspan><tspan dy="-6.3" font-size="10.2">(l)</tspan><tspan dy="6.3"> h</tspan><tspan dy="-6.3" font-size="10.2">(l−1)</tspan><tspan dy="6.3"> + b</tspan><tspan dy="-6.3" font-size="10.2">(l)</tspan><tspan dy="6.3">)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>θ ← θ − η ∇</tspan><tspan dy="4.8" font-size="10.2">θ</tspan><tspan dy="-4.8"> L</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>s(x) = ||x − D(E(x))||²</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>min</tspan><tspan dy="4.8" font-size="10.2">α</tspan><tspan dy="-4.8">  L</tspan><tspan dy="4.8" font-size="10.2">val</tspan><tspan dy="-4.8">(w*, α) + λ·HW(α)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>softmax(z)</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> = exp(z</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8">) / Σ</tspan><tspan dy="4.8" font-size="10.2">j</tspan><tspan dy="-4.8"> exp(z</tspan><tspan dy="4.8" font-size="10.2">j</tspan><tspan dy="-4.8">)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>L = −Σ</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> y</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> log p</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> </tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>EV = P(clear)·A − fee − P(bounce)·c</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>P(A | B) = P(B | A) P(A) / P(B)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>σ²</tspan><tspan dy="4.8" font-size="10.2">t</tspan><tspan dy="-4.8"> = ω + α·ε²</tspan><tspan dy="4.8" font-size="10.2">t−1</tspan><tspan dy="-4.8"> + β·σ²</tspan><tspan dy="4.8" font-size="10.2">t−1</tspan><tspan dy="-4.8"> </tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>p(attack | x) = σ(w</tspan><tspan dy="-6.3" font-size="10.2">T</tspan><tspan dy="6.3"> x + b)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>f(x) = φ</tspan><tspan dy="4.8" font-size="10.2">0</tspan><tspan dy="-4.8"> + Σ</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> φ</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8">(x)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>r</tspan><tspan dy="4.8" font-size="10.2">t</tspan><tspan dy="-4.8"> = ln(P</tspan><tspan dy="4.8" font-size="10.2">t</tspan><tspan dy="-4.8"> / P</tspan><tspan dy="4.8" font-size="10.2">t−1</tspan><tspan dy="-4.8">)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>h</tspan><tspan dy="-6.3" font-size="10.2">(l)</tspan><tspan dy="6.3"> = ReLU(W</tspan><tspan dy="-6.3" font-size="10.2">(l)</tspan><tspan dy="6.3"> h</tspan><tspan dy="-6.3" font-size="10.2">(l−1)</tspan><tspan dy="6.3"> + b</tspan><tspan dy="-6.3" font-size="10.2">(l)</tspan><tspan dy="6.3">)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>θ ← θ − η ∇</tspan><tspan dy="4.8" font-size="10.2">θ</tspan><tspan dy="-4.8"> L</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>s(x) = ||x − D(E(x))||²</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>min</tspan><tspan dy="4.8" font-size="10.2">α</tspan><tspan dy="-4.8">  L</tspan><tspan dy="4.8" font-size="10.2">val</tspan><tspan dy="-4.8">(w*, α) + λ·HW(α)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>softmax(z)</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> = exp(z</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8">) / Σ</tspan><tspan dy="4.8" font-size="10.2">j</tspan><tspan dy="-4.8"> exp(z</tspan><tspan dy="4.8" font-size="10.2">j</tspan><tspan dy="-4.8">)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>L = −Σ</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> y</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> log p</tspan><tspan dy="4.8" font-size="10.2">i</tspan><tspan dy="-4.8"> </tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>EV = P(clear)·A − fee − P(bounce)·c</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan><tspan>P(A | B) = P(B | A) P(A) / P(B)</tspan><tspan fill="#3B82F6" font-style="normal">      ·      </tspan></text></g>
