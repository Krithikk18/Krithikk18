<style>
@keyframes draw{from{stroke-dashoffset:2600}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grid{from{transform:translate(0,0)}to{transform:translate(-48px,-48px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes type{from{width:0}to{width:520px}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes cursor{from{transform:translateX(0)}to{transform:translateX(520px)}}
.g{animation:grid 14s linear infinite}
.walk{stroke-dasharray:2600;animation:draw 3.2s cubic-bezier(.4,0,.2,1) both}
.edge{stroke-dasharray:2600;animation:draw 3.4s ease .3s both}
.band{animation:fade 2.2s ease .8s both}
.bars rect{fill:#3DD6B5;fill-opacity:.55;transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.t1{animation:up .9s cubic-bezier(.2,.8,.2,1) .1s both}
.t2{animation:up .9s cubic-bezier(.2,.8,.2,1) .35s both}
.dot{animation:pulse 2s ease-in-out infinite}
.typeclip{animation:type 2.6s steps(52) 1s both}
.cur{animation:blink 1s steps(1) infinite, cursor 2.6s steps(52) 1s both}
.orb{transform-origin:1105px 95px;animation:spin 18s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
