<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Krithikk — CS undergrad in Cyber Security at Amrita, Coimbatore. Machine learning, intrusion detection and finance. Animated network mesh.">
<style>
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.s{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.f{font-family:'Cambria Math', 'STIX Two Math', Cambria, Georgia, 'Times New Roman', serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
@keyframes type{from{width:0}to{width:560px}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes cur{from{transform:translateX(0)}to{transform:translateX(468px)}}
.a1{animation:up .9s cubic-bezier(.2,.8,.2,1) .1s both}
.a2{animation:up .9s cubic-bezier(.2,.8,.2,1) 1.4s both}
.a3{animation:up .9s cubic-bezier(.2,.8,.2,1) 1.6s both}
.a4{animation:up .9s cubic-bezier(.2,.8,.2,1) 1.8s both}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
.tc{animation:type 2.2s steps(48) .5s both}
.cu{animation:blink 1s steps(1) infinite,cur 2.2s steps(48) .5s both}
@keyframes fx{0%,2%{opacity:0;transform:translateY(6px)}6%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-6px)}}
.fx{opacity:0;animation:fx 12s ease infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
