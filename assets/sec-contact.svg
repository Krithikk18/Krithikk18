<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="04 Reach Me">
<style>
@keyframes scan{from{transform:translateX(-260px)}to{transform:translateX(1200px)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.s{animation:scan 3.6s cubic-bezier(.6,0,.4,1) infinite}
.t{animation:up .8s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs><linearGradient id="sg04" x1="0" x2="1"><stop offset="0" stop-color="#F5A524" stop-opacity="0"/><stop offset=".5" stop-color="#F5A524"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="90" fill="#0A0D0B" rx="6"/>
<g class="t"><text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#F5A524">04</text>
<text x="70" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#E7EDE8">Reach Me</text></g>
<rect x="0" y="86" width="1200" height="1" fill="#1E2621"/>
<rect class="s" x="0" y="85" width="260" height="3" fill="url(#sg04)"/>
</svg>
