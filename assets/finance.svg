<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Animated finance panel: candlestick price chart with volume and moving average, and a rolling volatility series with a mean-reverting forecast">
<style>
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.s{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
@keyframes cd{0%,3%{transform:scaleY(0);opacity:0}8%,88%{transform:scaleY(1);opacity:1}95%,100%{transform:scaleY(0);opacity:0}}
@keyframes vb{0%,3%{transform:scaleY(0)}8%,88%{transform:scaleY(1)}95%,100%{transform:scaleY(0)}}
@keyframes dr{0%,10%{stroke-dashoffset:1600}60%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1600}}
@keyframes fc{0%,58%{opacity:0}66%,88%{opacity:1}95%,100%{opacity:0}}
.u{fill:#3B82F6;stroke:#3B82F6}.d{fill:#4B5563;stroke:#4B5563}.cd rect{stroke:none}.vb{fill-opacity:.45;stroke:none}
.cd{transform-box:fill-box;transform-origin:center;animation:cd 10s cubic-bezier(.2,.8,.2,1) infinite}
.vb{transform-box:fill-box;transform-origin:bottom;animation:vb 10s cubic-bezier(.2,.8,.2,1) infinite}
.dr{stroke-dasharray:1600;animation:dr 10s cubic-bezier(.4,0,.2,1) infinite}
.fc{animation:fc 10s ease infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
