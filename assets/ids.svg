<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Animated intrusion detection: IoT devices send traffic to a gateway IDS, a compromised camera triggers an anomaly-score spike and an alert row in the flow log">
<style>
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.s{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.f{font-family:'Cambria Math', 'STIX Two Math', Cambria, Georgia, 'Times New Roman', serif}
@keyframes win{0%,48%{opacity:0}52%,86%{opacity:1}90%,100%{opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes draw{0%{stroke-dashoffset:1400}80%,100%{stroke-dashoffset:0}}
@keyframes cur{0%{transform:translateX(0)}80%,100%{transform:translateX(560px)}}
.w{animation:win 8s linear infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 1.2s ease-out infinite}
.ln{stroke-dasharray:1400;animation:draw 8s linear infinite}
.cr{animation:cur 8s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
